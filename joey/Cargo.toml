[package]
name = "joey"
version = "0.172.0"
edition = "2024"
description = "rooz's helper: the small static binary that runs in the containers rooz starts"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

[dependencies]
bytes = "1.12.1"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
pki-types = { version = "1.15.1", package = "rustls-pki-types" }
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem", "x509-parser"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1.0.11"
