# Stock image + cached downloads instead of a prebuilt image. Caches are volumes shared by all
# your workspaces, so weir and the dotnet installer are downloaded once per engine, and every
# SDK version installs side by side under ~/.dotnet. Install steps run as the workspace user;
# `skip_if` makes a step a no-op when its check exits 0 (here: that SDK version is present).
#
# If this config comes from a git repo not listed in ROOZ_TRUSTED_CONFIGS, rooz refuses the cache
# paths unless you also list them in ROOZ_CACHES (or pass --caches).
image: mcr.microsoft.com/dotnet/runtime-deps:8.0
shell:
  - bash

vars:
  dotnet: 8.0.404

caches:
  - ~/.local/bin          # weir
  - ~/.cache/installers
  - ~/.dotnet
  - ~/.nuget

data:
  install-dotnet.weir:
    file: files/install-dotnet.weir

mounts:
  ~/install-dotnet.weir: install-dotnet.weir

env:
  DOTNET_ROOT: /home/rooz_user/.dotnet
  PATH: /home/rooz_user/.dotnet:/home/rooz_user/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

install:
  00-weir:
    skip_if: command -v weir
    run: curl -fsSL https://weir.sh/install.sh | sh
  10-dotnet:
    skip_if: dotnet --list-sdks | grep -q '^{{ dotnet }}'
    run: weir ~/install-dotnet.weir {{ dotnet }}
