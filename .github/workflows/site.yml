name: site

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths: ["docs/**", "CHANGELOG.md"]
  workflow_dispatch:
    inputs:
      channel:
        description: "deploy channel"
        type: choice
        options: [production, staging]
        default: production

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  MDBOOK_VERSION: 0.5.4
  MDBOOK_SHA256: 3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: site-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: site-${{ runner.os }}-cargo-

      - name: resolve channel and tag
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
            if [ "$RELEASE_PRERELEASE" = "true" ]; then
              echo "branch=staging" >> "$GITHUB_OUTPUT"
            else
              echo "branch=main" >> "$GITHUB_OUTPUT"
            fi
          else
            if ! tag=$(gh api repos/$GITHUB_REPOSITORY/releases/latest --jq .tag_name 2>/dev/null); then
              tag=""
            fi
            case "$tag" in
              v[0-9]*) ;;
              *) echo "releases/latest is '$tag' - not a rooz release tag" >&2; exit 1 ;;
            esac
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$CHANNEL" = "staging" ]; then
              echo "branch=staging" >> "$GITHUB_OUTPUT"
            else
              echo "branch=main" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: fetch the pinned installer from the release
        env:
          GH_TOKEN: ${{ github.token }}
          REL_TAG: ${{ steps.rel.outputs.tag }}
        run: |
          tag="$REL_TAG"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern install.sh --dir docs/src
          sh -n docs/src/install.sh
          grep -q "TAG=\"$tag\"" docs/src/install.sh \
            || { echo "installer from $tag does not pin $tag - refusing to deploy" >&2; exit 1; }

      - name: install the released rooz with that installer
        env:
          REL_TAG: ${{ steps.rel.outputs.tag }}
        run: |
          sh docs/src/install.sh
          tag="$REL_TAG"
          version="$(~/.local/bin/rooz --version)"
          [ "$version" = "rooz ${tag#v}" ] \
            || { echo "installed '$version', released '$tag'" >&2; exit 1; }
          ~/.local/bin/rooz config schema > docs/src/schema.json
          jq empty docs/src/schema.json

      - name: CLI reference from the released tag
        env:
          REL_TAG: ${{ steps.rel.outputs.tag }}
        run: |
          tag="$REL_TAG"
          git fetch --depth 1 origin tag "$tag"
          git worktree add "$RUNNER_TEMP/rel" "$tag"
          mkdir -p docs/src/reference
          (cd "$RUNNER_TEMP/rel" && CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" \
            cargo run --locked --quiet --example cli-reference) > docs/src/reference/cli.md
          grep -q "^Generated from \`rooz ${tag#v}\`" docs/src/reference/cli.md \
            || { echo "CLI reference is not rooz ${tag#v}'s" >&2; exit 1; }

      - name: install mdbook
        run: |
          url="https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/mdbook.tar.gz" "$url"
          echo "$MDBOOK_SHA256  $RUNNER_TEMP/mdbook.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/mdbook.tar.gz" -C "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/mdbook" /usr/local/bin/mdbook
          mdbook --version

      - name: stamp the version badge
        env:
          REL_TAG: ${{ steps.rel.outputs.tag }}
        run: |
          tag="$REL_TAG"
          sed -i "s/const version = \"dev\";/const version = \"$tag\";/" docs/theme/version.js
          grep -q "const version = \"$tag\";" docs/theme/version.js \
            || { echo "version badge not stamped with $tag" >&2; exit 1; }

      - name: build
        run: mdbook build docs

      - name: verify the artifact before it ships
        env:
          REL_TAG: ${{ steps.rel.outputs.tag }}
        run: |
          tag="$REL_TAG"
          sh -n docs/book/install.sh
          grep -q "TAG=\"$tag\"" docs/book/install.sh \
            || { echo "built site would serve an installer not pinned to $tag" >&2; exit 1; }
          jq empty docs/book/schema.json
          test -f docs/book/_headers
          grep -q "const version = \"$tag\";" docs/book/theme/version-*.js \
            || { echo "built site would show a version other than $tag" >&2; exit 1; }

      - name: deploy (Cloudflare Pages, direct upload)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REL_BRANCH: ${{ steps.rel.outputs.branch }}
        run: |
          npx --yes wrangler@4.151.1 pages deploy docs/book \
            --project-name rooz-dev \
            --branch "$REL_BRANCH"

      - name: served installer pins the released tag
        if: github.event_name == 'release' && github.event.release.prerelease == false
        env:
          REL_TAG: ${{ steps.rel.outputs.tag }}
        run: |
          tag="$REL_TAG"
          for i in $(seq 1 24); do
            served=$(curl -fsSL https://rooz.dev/install.sh 2>/dev/null | grep -m1 '^    TAG=' | cut -d'"' -f2 || true)
            [ "$served" = "$tag" ] && { echo "served installer pins $tag (after $((i * 5))s)"; exit 0; }
            sleep 5
          done
          echo "rooz.dev/install.sh serves '$served', released '$tag' - users are getting an older rooz" >&2
          exit 1
