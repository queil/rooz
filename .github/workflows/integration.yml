name: integration

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  # every CI build starts from scratch: incremental state is never reused, only cached and restored
  CARGO_INCREMENTAL: 0
  # file and line in a backtrace is all a test failure needs; full debuginfo is most of target/
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  # ── unit tests (no daemon) ──────────────────────────────────────────────────
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: cache
        uses: ./.github/actions/cargo-cache-restore
        with:
          name: unit
      - name: Unit and doc tests
        run: cargo test --lib --bins

      # saved from main only: a PR or a tag restores main's cache instead of adding its own
      - if: github.ref == 'refs/heads/main'
        uses: ./.github/actions/cargo-cache-save
        with:
          key: ${{ steps.cache.outputs.key }}
          hit: ${{ steps.cache.outputs.hit }}

  # ── integration tests (daemon required) ────────────────────────────────────
  integration:
    runs-on: ubuntu-latest
    # a run takes ~15 minutes; a hang in a harness engine call is cut off here
    timeout-minutes: 45
    strategy:
      matrix:
        engine: [docker, podman]
      fail-fast: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - id: cache
        uses: ./.github/actions/cargo-cache-restore
        with:
          name: dev

      - name: Build binary
        run: cargo build

      - name: Start ${{ matrix.engine }} daemon
        run: |
          set -o pipefail
          bash scripts/test-daemon.sh up ${{ matrix.engine }} \
            | grep '^export ' \
            | sed 's/^export //' \
            >> "$GITHUB_ENV"

      # the egress proxy rooz names is published by the release; the tests run this commit's
      - name: joey image from this commit
        run: |
          # a failed build or load must fail here, not as a pull error in the tests
          set -o pipefail
          bash scripts/joey-test-image.sh \
            | grep '^export ' \
            | sed 's/^export //' \
            >> "$GITHUB_ENV"

      - name: Integration tests
        # every test runs against the daemon or fails, never skips
        env:
          ROOZ_TEST_REQUIRE_DAEMON: "1"
        run: |
          cargo test \
            --test smoke \
            --test lifecycle \
            --test volumes \
            --test sidecars \
            --test networks \
            --test interactive \
            --test move_ws \
            -- --test-threads=1

      # saved from main only: a PR or a tag restores main's cache instead of adding its own
      - if: github.ref == 'refs/heads/main'
        uses: ./.github/actions/cargo-cache-save
        with:
          key: ${{ steps.cache.outputs.key }}
          hit: ${{ steps.cache.outputs.hit }}

      - name: Stop daemon
        if: always()
        run: bash scripts/test-daemon.sh down ${{ matrix.engine }}
