# Releases - a v* tag produces a DRAFT release carrying one bare binary per
# platform plus SHA256SUMS. The gate runs the full battery first and nothing
# builds if anything is red, the tag and Cargo.toml must agree, and every built
# binary has to report that same version before it is uploaded. Assets are
# uploaded separately from the release creation and retried, then the asset list
# is machine-checked: an incomplete draft fails the job instead of waiting for a
# human to notice. Publishing the draft stays manual.
name: release

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # the tag is the release's only input, so it has to agree with the crate
      # version before anything is built - a forgotten `cargo set-version` ships
      # a binary that reports the previous release
      - name: tag matches Cargo.toml
        run: |
          tag="${{ github.ref_name }}"
          crate="v$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          [ "$tag" = "$crate" ] || {
            echo "RELEASE REFUSED: tag is '$tag', Cargo.toml says '$crate'" >&2
            exit 1
          }
          echo "version: $tag"

      # the notes are written by hand, so a tag without a CHANGELOG section is a
      # release nobody described - refuse it here rather than publishing a draft
      # with an auto-generated commit list standing in for notes
      - name: the changelog describes this version
        run: |
          scripts/changelog-section.sh "${{ github.ref_name }}" > /dev/null || {
            version="${GITHUB_REF_NAME#v}"
            echo "RELEASE REFUSED: CHANGELOG.md has no '## [$version]' section - rename the 'Unreleased' one before tagging" >&2
            exit 1
          }

      - name: formatting
        run: cargo fmt --check

      - name: build
        run: cargo build --locked

      - name: unit tests
        run: cargo test --locked --lib --bins

      # the same daemon-backed battery as CI: a release cannot publish from red
      - name: start docker daemon
        run: |
          bash scripts/test-daemon.sh up docker \
            | grep '^export ' \
            | sed 's/^export //' \
            >> "$GITHUB_ENV"

      - name: integration tests
        run: |
          cargo test --locked \
            --test smoke \
            --test lifecycle \
            --test volumes \
            --test sidecars \
            --test networks \
            --test interactive \
            -- --test-threads=1

      - name: stop daemon
        if: always()
        run: bash scripts/test-daemon.sh down docker

  build:
    needs: gate
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    # attestation needs OIDC and the attestation store; the repo itself is only
    # read here - contents: write lives in publish
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: add target
        run: rustup target add ${{ matrix.target }}

      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # every runner is native, so the artifact can vouch for itself: the binary
      # that ships must report the tag it ships under
      - name: the binary reports the tag
        run: |
          bin="target/${{ matrix.target }}/release/rooz"
          expected="rooz ${GITHUB_REF_NAME#v}"
          actual="$("$bin" --version)"
          [ "$actual" = "$expected" ] || {
            echo "RELEASE REFUSED: --version says '$actual', expected '$expected'" >&2
            exit 1
          }
          cp "$bin" "rooz-${{ matrix.target }}"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: rooz-${{ matrix.target }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rooz-${{ matrix.target }}
          path: rooz-${{ matrix.target }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # the release notes come from the repository, so it has to be here too
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true

      - name: checksums
        run: |
          cd dist
          chmod +x rooz-*
          sha256sum rooz-* > SHA256SUMS
          cat SHA256SUMS

      # the hand-written section for this version, with the generated commit list
      # appended by --generate-notes
      - name: release notes from CHANGELOG.md
        run: scripts/changelog-section.sh "${{ github.ref_name }}" > notes.md

      # created with no assets: an upload that dies half way through used to
      # leave a release that looks complete. Uploads are their own retried step.
      - name: draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --draft \
            --title "rooz ${{ github.ref_name }}" \
            --notes-file notes.md \
            --generate-notes

      - name: upload assets (retried, --clobber)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            if gh release upload "${{ github.ref_name }}" --clobber \
                 --repo "${{ github.repository }}" \
                 dist/rooz-* dist/SHA256SUMS; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "upload attempt $attempt failed; backing off $((attempt * 20))s" >&2
              sleep $((attempt * 20))
            fi
          done
          echo "asset upload failed after 3 attempts" >&2
          exit 1

      # the completeness gate: every expected asset present, uploaded and
      # non-empty, before a human is asked to review a draft. The list here is
      # the release's contract - the install URLs in README.md point at these
      # exact names.
      - name: verify the draft carries every expected asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          expected="rooz-x86_64-unknown-linux-gnu
          rooz-aarch64-unknown-linux-gnu
          rooz-aarch64-apple-darwin
          rooz-x86_64-apple-darwin
          SHA256SUMS"
          gh release view "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --json assets --jq '.assets[] | "\(.name) \(.state) \(.size)"' > assets.txt
          cat assets.txt
          missing=0
          while read -r name; do
            [ -n "$name" ] || continue
            line="$(grep -E "^$name " assets.txt || true)"
            state="$(echo "$line" | awk '{print $2}')"
            size="$(echo "$line" | awk '{print $3}')"
            if [ "$state" != "uploaded" ] || [ -z "$size" ] || [ "$size" -le 0 ]; then
              echo "INCOMPLETE DRAFT: '$name' is ${state:-absent} (size ${size:-0})" >&2
              missing=1
            fi
          done <<< "$(echo "$expected" | sed 's/^[[:space:]]*//')"
          [ "$missing" -eq 0 ] || exit 1
          echo "draft ${{ github.ref_name }} carries every expected asset - publish it when you are happy with the notes"
