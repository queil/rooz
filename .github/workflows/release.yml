name: release

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: tag matches Cargo.toml
        run: |
          tag="${{ github.ref_name }}"
          crate="v$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          [ "$tag" = "$crate" ] || {
            echo "RELEASE REFUSED: tag is '$tag', Cargo.toml says '$crate'" >&2
            exit 1
          }
          echo "version: $tag"

      - name: the changelog describes this version
        run: |
          scripts/changelog-section.sh "${{ github.ref_name }}" > /dev/null || {
            version="${GITHUB_REF_NAME#v}"
            echo "RELEASE REFUSED: CHANGELOG.md has no '## [$version]' section - rename the 'Unreleased' one before tagging" >&2
            exit 1
          }

      - name: formatting
        run: cargo fmt --check

      - name: build
        run: cargo build --locked

      - name: unit tests
        run: cargo test --locked --lib --bins

      - name: start docker daemon
        run: |
          bash scripts/test-daemon.sh up docker \
            | grep '^export ' \
            | sed 's/^export //' \
            >> "$GITHUB_ENV"

      - name: integration tests
        run: |
          cargo test --locked \
            --test smoke \
            --test lifecycle \
            --test volumes \
            --test sidecars \
            --test networks \
            --test interactive \
            -- --test-threads=1

      - name: stop daemon
        if: always()
        run: bash scripts/test-daemon.sh down docker

  build:
    needs: gate
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    # attestation needs OIDC and the attestation store; the repo itself is only
    # read here - contents: write lives in publish
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: add target
        run: rustup target add ${{ matrix.target }}

      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # every runner is native, so the artifact can vouch for itself: the binary
      # that ships must report the tag it ships under
      - name: the binary reports the tag
        run: |
          bin="target/${{ matrix.target }}/release/rooz"
          expected="rooz ${GITHUB_REF_NAME#v}"
          actual="$("$bin" --version)"
          [ "$actual" = "$expected" ] || {
            echo "RELEASE REFUSED: --version says '$actual', expected '$expected'" >&2
            exit 1
          }
          cp "$bin" "rooz-${{ matrix.target }}"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: rooz-${{ matrix.target }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rooz-${{ matrix.target }}
          path: rooz-${{ matrix.target }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # the release notes come from the repository, so it has to be here too
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true

      - name: checksums
        run: |
          cd dist
          chmod +x rooz-*
          sha256sum rooz-* > SHA256SUMS
          cat SHA256SUMS

      # the PINNED installer: install.sh is a template; this copy pins the tag and embeds the
      # SHA256SUMS above, so the script rooz.dev serves trusts checksums from a different origin
      # than the binaries. The site workflow fetches it from this release.
      - name: generate the pinned installer
        run: |
          weir="weir-v0.0.74-linux-x64"
          curl -fsSL -o "$RUNNER_TEMP/weir" "https://github.com/weir-shell/weir/releases/download/v0.0.74/$weir"
          echo "dd8797ce9caa29d101f39f7096c624a92cea676922f8c1822ced7348e01611d9  $RUNNER_TEMP/weir" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/weir"
          "$RUNNER_TEMP/weir" scripts/gen-install.weir --template install.sh --sums dist/SHA256SUMS \
            --tag "${{ github.ref_name }}" --out dist/install.sh
          sh -n dist/install.sh

      # the hand-written section for this version, with the generated commit list
      # appended by --generate-notes
      - name: release notes from CHANGELOG.md
        run: scripts/changelog-section.sh "${{ github.ref_name }}" > notes.md

      # created with no assets: an upload that dies half way through used to
      # leave a release that looks complete. Uploads are their own retried step.
      - name: draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --draft \
            --title "rooz ${{ github.ref_name }}" \
            --notes-file notes.md \
            --generate-notes

      - name: upload assets (retried, --clobber)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            if gh release upload "${{ github.ref_name }}" --clobber \
                 --repo "${{ github.repository }}" \
                 dist/rooz-* dist/SHA256SUMS dist/install.sh; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "upload attempt $attempt failed; backing off $((attempt * 20))s" >&2
              sleep $((attempt * 20))
            fi
          done
          echo "asset upload failed after 3 attempts" >&2
          exit 1

      - name: verify the draft carries every expected asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          expected="rooz-x86_64-unknown-linux-gnu
          rooz-aarch64-unknown-linux-gnu
          rooz-aarch64-apple-darwin
          rooz-x86_64-apple-darwin
          SHA256SUMS
          install.sh"
          gh release view "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --json assets --jq '.assets[] | "\(.name) \(.state) \(.size)"' > assets.txt
          cat assets.txt
          missing=0
          while read -r name; do
            [ -n "$name" ] || continue
            line="$(grep -E "^$name " assets.txt || true)"
            state="$(echo "$line" | awk '{print $2}')"
            size="$(echo "$line" | awk '{print $3}')"
            if [ "$state" != "uploaded" ] || [ -z "$size" ] || [ "$size" -le 0 ]; then
              echo "INCOMPLETE DRAFT: '$name' is ${state:-absent} (size ${size:-0})" >&2
              missing=1
            fi
          done <<< "$(echo "$expected" | sed 's/^[[:space:]]*//')"
          [ "$missing" -eq 0 ] || exit 1
          echo "draft ${{ github.ref_name }} carries every expected asset - publish it when you are happy with the notes"
