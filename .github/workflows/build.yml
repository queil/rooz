name: build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:  
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
  
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Formatting
      run: cargo fmt --check
    - name: Clippy
      run: cargo clippy --locked --all-targets -- -D warnings

  joey:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Version matches rooz
      run: scripts/check-joey-version.sh
    - name: Formatting
      run: cargo fmt --check --manifest-path joey/Cargo.toml
    - name: Clippy
      run: cargo clippy --locked --manifest-path joey/Cargo.toml --all-targets -- -D warnings
    - name: Test
      run: cargo test --locked --manifest-path joey/Cargo.toml
