name: build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:  
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
  
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
